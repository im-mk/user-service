services:
  user-service:
    container_name: user-service
    image: user-service
    environment:
      DB_HOST: user-service-db
    ports:
      - "8080:8080"
    networks:
      - network1
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully

  postgres:
    container_name: user-service-db
    image: postgres:18
    volumes:
      # - postgres:/data/postgres # enable this line to persist data
      - ./database/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres
    ports:
      - "5432:5432"
    networks:
      - network1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 3

  liquibase:
    container_name: liquibase
    image: liquibase/liquibase:4.33
    command: --defaultsFile=liquibase.properties update
    volumes:
      - ./database/liquibase.properties:/liquibase/liquibase.properties
      - ./database/changelog.yaml:/liquibase/changelog/changelog.yaml
      - ./database/sql:/liquibase/changelog/sql
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://user-service-db:5432/${POSTGRES_DB}
      - LIQUIBASE_COMMAND_USERNAME=${POSTGRES_USER}
      - LIQUIBASE_COMMAND_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - network1
    depends_on:
      postgres:
        condition: service_healthy

networks:
  network1:
    driver: bridge

volumes:
  postgres:
