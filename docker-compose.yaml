name: user-service-stack
services:
  user-service:
    container_name: user-service
    build:
      context: ./src
    environment:
      DB_HOST: user-service-db
      DB_PORT: ${USER_SERVICE_DB_INTERNAL_PORT}
    ports:
      - ${USER_SERVICE_PORT}:${USER_SERVICE_PORT}
    networks:
      - network1
    depends_on:
      user-service-db:
        condition: service_healthy
    volumes:
      - ./src/.keys:/app/.keys

  user-service-db:
    container_name: user-service-db
    image: postgres:18.3
    volumes:
      # - user-service-db:/data/postgres # enable this line to persist data
      - ./database/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${USER_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${USER_SERVICE_DB_PASSWORD}
      PGDATA: /data/postgres
    ports:
      - ${USER_SERVICE_DB_EXTERNAL_PORT}:${USER_SERVICE_DB_INTERNAL_PORT}
    networks:
      - network1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $USER_SERVICE_DB_USER -d $USER_SERVICE_DB_NAME",
        ]
      interval: 5s
      timeout: 5s
      retries: 3

  user-service-liquibase:
    container_name: user-service-liquibase
    image: liquibase/liquibase:5.0.1
    entrypoint:
      [
        "sh",
        "-c",
        "liquibase lpm list | grep postgresql || liquibase lpm add postgresql --global; liquibase update",
      ]
    command: --defaultsFile=liquibase.properties update
    volumes:
      - ./database/liquibase.properties:/liquibase/liquibase.properties
      - ./database/changelog.yaml:/liquibase/changelog/changelog.yaml
      - ./database/sql:/liquibase/changelog/sql
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://user-service-db:${USER_SERVICE_DB_INTERNAL_PORT}/${USER_SERVICE_DB_NAME}
      - LIQUIBASE_COMMAND_USERNAME=${USER_SERVICE_DB_USER}
      - LIQUIBASE_COMMAND_PASSWORD=${USER_SERVICE_DB_PASSWORD}
    networks:
      - network1
    depends_on:
      user-service-db:
        condition: service_healthy

  user-service-pgadmin:
    container_name: user-service-pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False" # required to mount the servers.json file
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False" # Avoid master password prompt
    volumes:
      - user-service-pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - network1
    restart: unless-stopped

networks:
  network1:
    driver: bridge

volumes:
  user-service-db:
  user-service-pgadmin:
