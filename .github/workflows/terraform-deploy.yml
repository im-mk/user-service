name: Terraform Deploy and Push Docker Image

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  terraform:
    name: Setup ECR using Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Initialize Terraform
        working-directory: ./infra/aws
        run: terraform init

      - name: Apply Terraform
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform apply -auto-approve

      - name: Extract ECR repository URL
        id: ecr
        working-directory: ./terraform
        run: echo "ECR_URL=$(terraform output -raw repository_url)" >> $GITHUB_ENV

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Amazon ECR
        run: echo ${{ secrets.AWS_SECRET_ACCESS_KEY }} | docker login --username AWS --password-stdin ${{ env.ECR_URL }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ECR_URL }}:latest .

      - name: Tag Docker image
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          docker tag ${{ env.ECR_URL }}:latest ${{ env.ECR_URL }}:$IMAGE_TAG

      - name: Push Docker image to ECR
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          docker push ${{ env.ECR_URL }}:$IMAGE_TAG
          docker push ${{ env.ECR_URL }}:latest
